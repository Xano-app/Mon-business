function TradingChart({sales}){
  const[tooltip,setTooltip]=useState(null);
  const svgRef=useRef(null);
  const now=new Date();
  const daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const todayN=now.getDate();
  const days=useMemo(()=>Array.from({length:daysInMonth},(_,i)=>{
    const day=i+1;
    const key=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const ds=sales.filter(s=>s.date===key);
    return{day,key,profit:ds.reduce((a,s)=>a+Number(s.profit),0),count:ds.length,isFuture:day>todayN};
  }),[sales]);
  let cum=0;
  const cumDays=days.map(d=>{if(!d.isFuture){cum+=d.profit;}return{...d,cum};});
  const pastDays=cumDays.filter(d=>!d.isFuture);
  const maxCum=Math.max(...pastDays.map(d=>d.cum),1);
  const minCum=Math.min(...pastDays.map(d=>d.cum),0);
  const range=maxCum-minCum||1;
  const totalMonth=pastDays.reduce((a,d)=>a+d.profit,0);
  const avgDaily=pastDays.length?totalMonth/pastDays.length:0;
  const projection=Math.round(avgDaily*daysInMonth);
  const W=340,H=110,padX=8,padY=10;
  const xOf=i=>(padX+(i/(pastDays.length-1||1))*(W-padX*2));
  const yOf=v=>(H-padY-(((v-minCum)/range)*(H-padY*2)));
  const pts=pastDays.map((d,i)=>`${xOf(i)},${yOf(d.cum)}`).join(" ");
  const trend=totalMonth>0?"up":"flat";
  const handleMove=useCallback((e)=>{
    if(!svgRef.current)return;
    const rect=svgRef.current.getBoundingClientRect();
    const clientX=(e.touches?e.touches[0].clientX:e.clientX);
    const relX=clientX-rect.left;
    const pct=relX/rect.width;
    const idx=Math.round(pct*(pastDays.length-1));
    const d=pastDays[Math.max(0,Math.min(idx,pastDays.length-1))];
    if(d)setTooltip({...d,x:relX,idx});
  },[pastDays]);
  return(
    <div style={{background:"#fff",borderRadius:18,border:"1px solid #E5E7EB",padding:"20px 18px",boxShadow:"0 2px 8px rgba(0,0,0,.07)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:"#6B7280",textTransform:"uppercase",letterSpacing:".08em"}}>{MONTH_FR[now.getMonth()]} {now.getFullYear()}</div>
          <div style={{fontWeight:900,fontSize:30,color:"#008060",lineHeight:1.1,marginTop:2}}>+{f0(totalMonth)}€</div>
          <div style={{fontSize:12,color:"#6B7280",marginTop:3}}>Projection : <b style={{color:"#008060"}}>~{projection}€</b></div>
        </div>
        <div style={{background:trend==="up"?"#ECFDF5":"#F9FAFB",border:`1px solid ${trend==="up"?"#6EE7B7":"#E5E7EB"}`,borderRadius:99,padding:"4px 12px",display:"flex",alignItems:"center",gap:5}}>
          <span style={{fontSize:14}}>{trend==="up"?"📈":"➡️"}</span>
          <span style={{fontSize:12,fontWeight:700,color:trend==="up"?"#059669":"#6B7280"}}>{trend==="up"?"En hausse":"Stable"}</span>
        </div>
      </div>
      <div style={{position:"relative",touchAction:"none"}}>
        <svg ref={svgRef} width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible",display:"block",cursor:"crosshair"}}
          onMouseMove={handleMove} onTouchMove={handleMove}
          onMouseLeave={()=>setTooltip(null)} onTouchEnd={()=>setTimeout(()=>setTooltip(null),2000)}>
          <defs>
            <linearGradient id="grd" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#008060" stopOpacity=".2"/>
              <stop offset="100%" stopColor="#008060" stopOpacity="0"/>
            </linearGradient>
          </defs>
          {[0.25,0.5,0.75].map(f=>(
            <line key={f} x1={padX} x2={W-padX} y1={padY+(1-f)*(H-padY*2)} y2={padY+(1-f)*(H-padY*2)} stroke="#F3F4F6" strokeWidth="1"/>
          ))}
          {pastDays.length>1&&<polygon points={`${xOf(0)},${yOf(minCum)} ${pts} ${xOf(pastDays.length-1)},${yOf(minCum)}`} fill="url(#grd)"/>}
          {pastDays.length>1&&<polyline points={pts} fill="none" stroke="#008060" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>}
          {pastDays.filter(d=>d.profit>0).map((d)=>{
            const i=pastDays.indexOf(d);
            return <circle key={d.day} cx={xOf(i)} cy={yOf(d.cum)} r="4" fill="#008060" stroke="#fff" strokeWidth="2"/>;
          })}
          {tooltip&&(
            <React.Fragment>
              <line x1={xOf(tooltip.idx)} x2={xOf(tooltip.idx)} y1={padY} y2={H-padY} stroke="#008060" strokeWidth="1.5" strokeDasharray="3,2"/>
              <circle cx={xOf(tooltip.idx)} cy={yOf(tooltip.cum)} r="6" fill="#008060" stroke="#fff" strokeWidth="2.5"/>
            </React.Fragment>
          )}
        </svg>
        {tooltip&&(
          <div style={{position:"absolute",top:0,left:Math.min(tooltip.x+8,180),background:"#1A1A2E",color:"#fff",borderRadius:10,padding:"10px 14px",fontSize:12,pointerEvents:"none",zIndex:10,boxShadow:"0 4px 16px rgba(0,0,0,.2)",minWidth:140}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>{tooltip.day} {MONTH_FR[now.getMonth()]}</div>
            {tooltip.profit>0?(
              <React.Fragment>
                <div style={{color:"#6EE7B7"}}>Profit : <b>+{f0(tooltip.profit)}€</b></div>
                <div style={{color:"#94A3B8",marginTop:2}}>{tooltip.count} vente{tooltip.count>1?"s":""}</div>
                <div style={{color:"#94A3B8"}}>Cumule : +{f0(tooltip.cum)}€</div>
                <div style={{marginTop:4,color:tooltip.profit>=avgDaily?"#6EE7B7":"#FCA5A5",fontSize:11}}>
                  {tooltip.profit>=avgDaily?"Au-dessus moy.":"En dessous moy."}
                </div>
              </React.Fragment>
            ):(
              <div style={{color:"#6B7280"}}>Pas de vente</div>
            )}
          </div>
        )}
      </div>
      <div style={{display:"flex",gap:2,alignItems:"flex-end",height:28,marginTop:12}}>
        {days.map((d,i)=>{
          const maxP=Math.max(...days.map(x=>x.profit),1);
          const isToday=d.day===todayN;
          return <div key={i} style={{flex:1,background:d.isFuture?"#F9FAFB":d.profit>0?"#008060":"#E5E7EB",borderRadius:3,height:d.profit>0?`${Math.max((d.profit/maxP)*26,4)}px`:"3px",border:isToday?"2px solid #B8860B":"none"}}/>;
        })}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#9CA3AF",marginTop:4}}>
        <span>1 {MONTH_FR[now.getMonth()]}</span>
        <span style={{color:"#B8860B",fontWeight:700}}>Auj.</span>
        <span>{daysInMonth}</span>
      </div>
    </div>
  );
}

  const wProfit=wSales.reduce((a,s)=>a+Number(s.profit),0);
  const mProfit=mSales.reduce((a,s)=>a+Number(s.profit),0);
  const mCA=mSales.reduce((a,s)=>a+Number(s.salePrice),0);
  const avgSale=sales.length?totalProfit/sales.length:0;
  const todayOk=tSales.length>=1;
  const streak=useMemo(()=>calcStreak(sales),[sales]);
  const currentDay=dayFR();
  const dueAlerts=(alerts||[]).filter(a=>a.date===todayStr()&&!a.done);

  const now=new Date();

  const totalArt=articles.length;

  const sellThrough=totalArt?Math.round(soldArt/totalArt*100):0;
  const calcProfit=calcBuy&&calcSell?parseFloat(calcSell)-parseFloat(calcBuy)-0.10:null;
  const calcPct=calcProfit&&calcSell?(calcProfit/parseFloat(calcSell)*100):null;

  const monthlyData=useMemo(()=>{
    return Array.from({length:6},(_,i)=>{
      const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;

      return{label:MONTH_FR[d.getMonth()],profit:ms.reduce((a,s)=>a+Number(s.profit),0),ca:ms.reduce((a,s)=>a+Number(s.salePrice),0),count:ms.length};
    });
  },[sales]);
  const maxBar=Math.max(...monthlyData.map(m=>m.profit),1);

              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:900,fontSize:28,lineHeight:1}}>{f0(totalCA)}€</div>

            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
              {[{l:"Profit total",v:`+${f0(totalProfit)}€`},{l:"Ce mois",v:`+${f0(mProfit)}€`},{l:"Semaine",v:`+${f0(wProfit)}€`},{l:"Projection",v:`~${f0(projection)}€`}].map(k=>(
                <div key={k.l} style={{background:"rgba(255,255,255,.12)",borderRadius:10,padding:"10px 8px",textAlign:"center"}}>
                  <div style={{fontWeight:800,fontSize:14,lineHeight:1}}>{k.v}</div>
                  <div style={{fontSize:9,opacity:.7,textTransform:"uppercase",letterSpacing:".05em",marginTop:3}}>{k.l}</div>
                </div>
              ))}
            </div>
          </div>
          <TradingChart sales={sales}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div className="kpi" style={{borderLeft:`4px solid ${G.green}`}}>

            <div className="kpi" style={{borderLeft:`4px solid ${G.gold}`}}>

            <div className="kpi" style={{borderLeft:`4px solid ${G.blue}`}}>

                    </div>
                    <div className="prog-bar"><div className="prog-fill" style={{width:`${Math.min(o.d/o.g*100,100)}%`,background:o.c}}/></div>

              </div>

              ))}
            </div>
          </div>

              </div>
            ))}

            <div style={card}>
              <div style={hd}>📅 Programme — {currentDay}</div>

              {PLANNING[currentDay].slots.map((sl,i)=>(
                <div key={i} style={{display:"flex",gap:10,padding:"9px 0",borderTop:i===0?"none":"1px solid #F3F4F6"}}>
                  <div style={{fontSize:11,fontWeight:700,color:G.green,minWidth:108,flexShrink:0}}>{sl.t}</div>
                  <div style={{fontSize:13,fontWeight:500}}>{sl.a}</div>
                </div>
              ))}
            </div>
          )}

            <div style={hd}>🧮 Calculateur de marge</div>
            <div className="row2" style={{marginBottom:10}}>

              <div><label>Prix vente (€)</label><input style={inp} type="number" placeholder="0" value={calcSell} onChange={e=>setCalcSell(e.target.value)}/></div>
            </div>
            <div style={{marginBottom:10}}><label>Marge min. (%)</label><input style={inp} type="number" value={marginTarget} onChange={e=>setMarginTarget(e.target.value)}/></div>
            {calcProfit!==null&&(
              <div style={{background:calcOk?G.greenL:G.redL,border:`1.5px solid ${calcOk?"#6EE7B7":"#FCA5A5"}`,borderRadius:10,padding:"12px 16px"}}>
                <div style={{fontWeight:800,fontSize:15,color:calcOk?G.greenD:G.red}}>{calcOk?"Investissement rentable !":"Marge insuffisante"}</div>
                <div style={{fontSize:12,marginTop:4,color:G.muted}}>Profit net : <b>+{f2(calcProfit)}€</b> · Marge : <b>{calcPct?.toFixed(1)}%</b></div>
              </div>
            )}
          </div>
          <div style={card}>
            <div style={hd}>⏰ Rappels</div>
            <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
              <div><label>Rappel</label><input style={inp} placeholder="Ex: Relancer acheteur Nike..." value={alertForm.text} onChange={e=>setAlertForm(f=>({...f,text:e.target.value}))}/></div>
              <div><label>Date</label><input style={inp} type="date" value={alertForm.date} onChange={e=>setAlertForm(f=>({...f,date:e.target.value}))}/></div>
              <button style={btn()} onClick={addAlert}>Ajouter le rappel</button>
            </div>
            {(alerts||[]).filter(a=>!a.done).length===0&&<div style={{color:G.muted,fontSize:13,textAlign:"center",padding:8}}>Aucun rappel actif</div>}
            {(alerts||[]).filter(a=>!a.done).map(a=>(
              <div key={a.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderTop:`1px solid ${G.border}`}}>
                <div><div style={{fontSize:13,fontWeight:600}}>{a.text}</div><div style={{fontSize:11,color:G.muted}}>{a.date}</div></div>
                <button onClick={()=>doneAlert(a.id)} style={{background:G.greenL,border:`1px solid #6EE7B7`,borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:700,color:G.green,cursor:"pointer"}}>✓</button>
              </div>
            ))}
          </div>
        </div>}

        {tab==="ventes"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={card}>
            <div style={hd}>💰 Enregistrer une vente</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <div><label>Article</label><input style={inp} placeholder="Ex: Nike Air Max T42" value={saleForm.title} onChange={e=>setSaleForm(f=>({...f,title:e.target.value}))}/></div>
              <div className="row2">
                <div><label>Plateforme</label><select style={inp} value={saleForm.platform} onChange={e=>setSaleForm(f=>({...f,platform:e.target.value}))}>{PLATFORMS.map(p=><option key={p}>{p}</option>)}</select></div>
                <div><label>Date</label><input style={inp} type="date" value={saleForm.date} onChange={e=>setSaleForm(f=>({...f,date:e.target.value}))}/></div>
              </div>
              <div className="row2">
                <div><label>Prix achat (€)</label><input style={inp} type="number" placeholder="0" value={saleForm.buyPrice} onChange={e=>setSaleForm(f=>({...f,buyPrice:e.target.value}))}/></div>
                <div><label>Prix vente (€)</label><input style={inp} type="number" placeholder="0" value={saleForm.salePrice} onChange={e=>setSaleForm(f=>({...f,salePrice:e.target.value}))}/></div>
              </div>
              {saleForm.buyPrice&&saleForm.salePrice&&(
                <div style={{background:G.greenL,border:"1.5px solid #6EE7B7",borderRadius:10,padding:"10px 14px",fontSize:13,fontWeight:700,color:G.greenD}}>
                  Profit net : +{f2(parseFloat(saleForm.salePrice)-parseFloat(saleForm.buyPrice)-0.10)}€
                </div>
              )}
              <button style={btn()} onClick={addSale}>Valider la vente ✓</button>
            </div>
          </div>
          <div style={card}>
            <div style={hd}>Historique — {sales.length} ventes</div>
            {sales.map(s=>(
              <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderTop:`1px solid ${G.border}`}}>
                <div style={{flex:1,minWidth:0,paddingRight:12}}>
                  <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.title}</div>
                  <div style={{fontSize:11,color:G.muted,marginTop:2}}>{s.platform} · {s.date}</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontWeight:800,fontSize:14}}>{f2(s.salePrice)}€</div>
                  <div style={{fontSize:12,fontWeight:700,color:G.green}}>+{f0(s.profit)}€</div>
                </div>
              </div>
            ))}
          </div>
        </div>}

        {tab==="articles"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={card}>
            <div style={hd}>📦 Ajouter un article</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <div><label>Nom</label><input style={inp} placeholder="Ex: Jordan 1 Retro T41" value={artForm.title} onChange={e=>setArtForm(f=>({...f,title:e.target.value}))}/></div>
              <div><label>Plateforme</label><select style={inp} value={artForm.platform} onChange={e=>setArtForm(f=>({...f,platform:e.target.value}))}>{PLATFORMS.map(p=><option key={p}>{p}</option>)}</select></div>
              <button style={btn()} onClick={addArt}>Ajouter</button>
            </div>
          </div>
          <div style={card}>
            <div style={hd}>Suivi — {articles.length} articles</div>

            {articles.map(a=>(
              <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 0",borderTop:`1px solid ${G.border}`}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{a.title}</div>
                  <div style={{fontSize:11,color:G.muted,marginTop:2}}>{a.platform} · {a.date}</div>
                </div>
                <button className="pill" style={{background:STATUS_META[a.status].bg,color:STATUS_META[a.status].color,flexShrink:0}} onClick={()=>cycleStatus(a.id)}>{STATUS_META[a.status].label}</button>
                <button onClick={()=>delArt(a.id)} style={{background:"none",border:"none",color:"#D1D5DB",cursor:"pointer",fontSize:18,paddingLeft:6}}>×</button>
              </div>
            ))}
          </div>
        </div>}

        {tab==="planning"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>

            <div style={{fontSize:12,color:"rgba(255,255,255,.8)"}}>Lun:2 · Mer:3 · Ven:2 · Sam:2 · Dim:1</div>

            <div key={day} style={{...card,borderLeft:`4px solid ${day===currentDay?G.green:G.border}`,background:day===currentDay?"#F0FDF4":"#fff"}}>

                <div style={{fontWeight:800,fontSize:16,color:day===currentDay?G.green:G.text}}>

                {data.school&&<div style={{fontSize:11,fontWeight:700,color:"#D97706",background:"#FEF3C7",borderRadius:8,padding:"3px 10px"}}>{data.school}</div>}

                <div key={i} style={{display:"flex",gap:10,padding:"9px 0",borderTop:i===0?"none":"1px solid #F3F4F6"}}>

                  <div style={{fontSize:13,fontWeight:500}}>{sl.a}</div>

            </div>

            {[{l:"CA Total",v:`${f0(totalCA)}€`,c:G.blue},{l:"Profit Total",v:`+${f0(totalProfit)}€`,c:G.green},{l:"Ventes",v:sales.length,c:G.gold},{l:"Marge Moy.",v:`+${f0(avgSale)}€`,c:"#7C3AED"}].map(k=>(

                <div style={{fontSize:10,fontWeight:700,color:G.muted,textTransform:"uppercase"}}>{k.l}</div>
                <div style={{fontWeight:900,fontSize:26,color:k.c,marginTop:4}}>{k.v}</div>

            <div style={hd}>Records</div>
            {(()=>{
              const bm=monthlyData.reduce((a,b)=>b.profit>a.profit?b:a,monthlyData[0]);

              return(
                <div style={{display:"flex",flexDirection:"column",gap:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${G.border}`}}>
                    <div><div style={{fontWeight:700,fontSize:13}}>Meilleur mois</div><div style={{fontSize:11,color:G.muted}}>{bm?.label}</div></div>
                    <div style={{fontWeight:900,fontSize:20,color:G.gold}}>+{f0(bm?.profit||0)}€</div>
                  </div>
                  {bs&&<div style={{display:"flex",justifyContent:"space-between",padding:"10px 0"}}>
                    <div><div style={{fontWeight:700,fontSize:13}}>Meilleure vente</div><div style={{fontSize:11,color:G.muted,maxWidth:200,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{bs.title}</div></div>
                    <div style={{fontWeight:900,fontSize:20,color:G.gold}}>+{f0(bs.profit)}€</div>
                  </div>}
                </div>
              );
            })()}
          </div>
          <div style={card}>
            <div style={hd}>Profit mensuel</div>
            <div style={{display:"flex",gap:6,alignItems:"flex-end",height:100,marginBottom:10}}>
              {monthlyData.map((m,i)=>(
                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                  <div style={{fontSize:9,fontWeight:700,color:G.green,minHeight:14}}>{m.profit>0?`+${f0(m.profit)}`:""}</div>
                  <div style={{width:"100%",background:"#F3F4F6",borderRadius:6,height:72,display:"flex",alignItems:"flex-end",overflow:"hidden"}}>
                    <div style={{width:"100%",background:`linear-gradient(180deg,${G.green},#004C3F)`,borderRadius:6,height:`${(m.profit/maxBar)*100}%`}}/>
                  </div>
                  <div style={{fontSize:9,fontWeight:700,color:G.muted}}>{m.label}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={card}>
            <div style={hd}>Par periode</div>
            {[{l:"Aujourd'hui",s:tSales,p:tProfit,c:"#F59E0B"},{l:"Semaine",s:wSales,p:wProfit,c:G.green},{l:"Mois",s:mSales,p:mProfit,c:"#7C3AED"},{l:"Total",s:sales,p:totalProfit,c:G.blue}].map(p=>(
              <div key={p.l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderTop:`1px solid ${G.border}`}}>
                <div><div style={{fontWeight:700,fontSize:13}}>{p.l}</div><div style={{fontSize:11,color:G.muted}}>{p.s.length} vente{p.s.length!==1?"s":""}</div></div>
                <div style={{fontWeight:900,fontSize:22,color:p.c}}>+{f0(p.p)}€</div>
              </div>
            ))}
          </div>
          <div style={card}>
            <div style={hd}>Top ventes</div>
            {[...sales].sort((a,b)=>Number(b.profit)-Number(a.profit)).slice(0,5).map((s,i)=>(
              <div key={s.id} style={{display:"flex",gap:12,alignItems:"center",padding:"10px 0",borderTop:i>0?`1px solid ${G.border}`:"none"}}>
                <div style={{fontWeight:900,fontSize:17,color:["#F59E0B","#9CA3AF","#B45309"][i]||G.muted,width:26}}>#{i+1}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.title}</div>
                  <div style={{fontSize:11,color:G.muted}}>{s.platform} · {s.date}</div>
                </div>
                <div style={{fontWeight:800,fontSize:15,color:G.green,flexShrink:0}}>+{f0(s.profit)}€</div>
              </div>
            ))}
          </div>
          <div style={card}>
            <div style={hd}>Par plateforme</div>
            {PLATFORMS.map(p=>{
              const ps=sales.filter(s=>s.platform===p);
              if(!ps.length)return null;
              return(
                <div key={p} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderTop:`1px solid ${G.border}`}}>
                  <div><div style={{fontWeight:700,fontSize:13}}>{p}</div><div style={{fontSize:11,color:G.muted}}>{ps.length} ventes</div></div>
                  <div style={{fontWeight:900,fontSize:20,color:G.green}}>+{f0(ps.reduce((a,s)=>a+Number(s.profit),0))}€</div>
                </div>
              );
            })}
          </div>
        </div>}
      </div>

      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:"1px solid #E5E7EB",display:"flex",padding:"8px 0 16px",zIndex:20,boxShadow:"0 -2px 16px rgba(0,0,0,.07)"}}>
        {TABS.map(t=>(
          <button key={t.id} className={`tab-b ${tab===t.id?"on":""}`} onClick={()=>setTab(t.id)}>
            <span className="ico">{t.icon}</span>{t.l}
          </button>
        ))}
      </div>
      {toast&&<div className={`toast ${toast.type}`}>{toast.msg}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
